<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Surprise for you Sona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-home">
  <div class="ambient ambient-left" aria-hidden="true"></div>
  <div class="ambient ambient-right" aria-hidden="true"></div>

  <header class="site-header">
    <a class="site-brand" href="index.html">
      <strong>Roshani</strong>
      <span>Teddy birthday journey</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <a href="index.html" aria-current="page">Home</a>
      <a href="countdown.html">Countdown</a>
      <a href="story.html">Story</a>
      <a href="gallery.html">Gallery</a>
      <a href="letter.html">Letter</a>
      <a href="surprise.html">Finale</a>
    </nav>
  </header>

  <section class="loader-screen" aria-label="Loading screen">
    <div class="loader-card">
      <div class="loader-heart" aria-hidden="true">&hearts;</div>
      <p class="loader-label">Loading Sona 20th birthday surprise</p>
      <h2 class="loader-percentage" id="loadingPercentage">0%</h2>
      <div class="loader-bar" aria-hidden="true">
        <span class="loader-progress" id="loadingProgress"></span>
      </div>
    </div>
  </section>

  <main class="experience page-shell" id="experience">
    <section class="welcome-section" id="welcome">
      <div class="welcome-card">
        <p class="eyebrow">A romantic birthday hub for Sona</p>
        <h1>🎂🩷 Happy 20th Birthday, Bachha! 🥹💖🎉🧸✨</h1>
        <button class="start-journey" type="button">Start Journey</button>
      </div>

      <div class="floating-hearts" aria-hidden="true">
        <span>&hearts;</span>
        <span>&hearts;</span>
        <span>&hearts;</span>
        <span>&hearts;</span>
        <span>&hearts;</span>
      </div>
    </section>
  </main>

  <div class="custom-cursor" id="customCursor" aria-hidden="true"></div>
  <div class="sparkle-layer" id="sparkleLayer" aria-hidden="true"></div>

  <script src="js/script.js"></script>
</body>
</html>
